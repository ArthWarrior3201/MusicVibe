<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · MusicVibe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238b5cf6' d='M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="app.html">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></span>
    MusicVibe
  </a>
  <div class="right">
    <span class="avatar" id="avatar"></span>
    <button class="btn ghost small" id="signout">Sign out</button>
  </div>
</header>

<main class="container" id="main" hidden>
  <div class="alert warn show" id="verify" hidden style="margin-bottom:16px">
    Please verify your email. We sent a link to <strong id="verify-email"></strong>.
    <button class="link-btn" id="resend">Resend</button>
  </div>

  <section class="panel">
    <h2>Hey, <span id="name"></span> 👋</h2>
    <p class="muted" style="margin:0">@<span id="username"></span></p>
  </section>

  <section class="panel">
    <h2>Your feed</h2>
    <p class="muted">Coming next: posts and new releases from artists you follow.</p>
    <div class="grid">
      <div class="tile">Feed</div>
      <div class="tile">Playlists</div>
      <div class="tile">Following</div>
      <div class="tile"><a href="../ProArtists/">Artist profile →</a></div>
    </div>
  </section>
</main>

<script type="module">
  import { requireUser, signOut, resendVerification, friendlyError } from "./core/mv.js";

  const { user, profile } = await requireUser();
  const $ = (s) => document.querySelector(s);

  $("#name").textContent = profile.displayName;
  $("#username").textContent = profile.username;
  const av = $("#avatar");
  if (profile.photoURL) {
    const img = new Image();
    img.src = profile.photoURL;
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    av.append(img);
  } else {
    av.textContent = profile.displayName[0].toUpperCase();
  }

  if (!user.emailVerified && user.providerData.some((p) => p.providerId === "password")) {
    $("#verify").hidden = false;
    $("#verify-email").textContent = user.email;
    $("#resend").onclick = async (e) => {
      try { await resendVerification(); e.target.textContent = "Sent ✓"; e.target.disabled = true; }
      catch (err) { alert(friendlyError(err)); }
    };
  }

  $("#signout").onclick = async () => { await signOut(); location.replace("./"); };
  $("#main").hidden = false;
</script>
</body>
</html>
