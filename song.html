<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Song · MusicVibe</title>
  <!-- auto-refresh when a new version is deployed (runs even if the rest fails to load) -->
  <script type="module" src="core/updater.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="app.html">
    <img class="logo" src="img/logo-192.png" alt="" width="34" height="34">
    MusicVibe
  </a>
  <div class="right">
    <a class="btn ghost small" href="../ProArtists/">ProArtists</a>
  </div>
</header>

<main class="container" id="main" hidden>
  <section class="panel">
    <div class="song-head">
      <div class="cover" id="cover"></div>
      <div>
        <div class="eyebrow">Song</div>
        <h1 id="title"></h1>
        <div id="artists"></div>
      </div>
    </div>
    <audio class="player" id="player" controls preload="metadata"></audio>
    <div class="add-to-playlist" id="add-pl">
      <select id="pl-select" aria-label="Playlist"></select>
      <button class="btn ghost small" id="pl-add" type="button">Add to playlist</button>
      <span class="hint" id="pl-msg"></span>
    </div>
  </section>

  <div class="two-col">
    <section id="about"></section>
    <section class="panel">
      <h2>Credits</h2>
      <div id="credits"></div>
    </section>
  </div>
</main>

<main class="container" id="missing" hidden>
  <section class="panel"><h2>Song not found</h2><p class="muted">It may have been deleted. <a href="app.html">Go home</a></p></section>
</main>

<script type="module">
  import { requireUser, getSong, mediaUrl, listMyPlaylists, createPlaylist, addToPlaylist, friendlyError } from "./core/mv.js";
  import { artistTile, creditsList, artistLine, el, playlistUrl, shareButton } from "./core/ui.js";

  const { user } = await requireUser();
  const $ = (s) => document.querySelector(s);
  const id = new URLSearchParams(location.search).get("id");
  const data = id ? await getSong(id).catch(() => null) : null; // bad/unknown id -> "not found"

  if (!data) {
    $("#missing").hidden = false;
  } else {
    const { song, artist, credits, artists } = data;
    document.title = `${song.title} · MusicVibe`;
    $("#title").textContent = song.title;
    $("#artists").append(artistLine(credits, artists, song.artist_id));
    const cover = mediaUrl(song.cover_media_id) || mediaUrl(artist?.avatar_media_id);
    $("#cover").append(cover ? el("img", { src: cover, alt: "" }) : el("img", { src: "img/logo-512.png", alt: "" }));
    $("#player").src = mediaUrl(song.audio_media_id);
    // The main artist (who uploaded it on ProArtists) gets the big tile.
    if (artist) $("#about").append(artistTile(artist, { showFollow: artist.id !== user.id }));
    $("#add-pl").append(shareButton({ title: song.title, text: `${song.title} by ${artist?.name || "an artist"} on MusicVibe` }));

    // ---------- add to playlist ----------
    const sel = $("#pl-select");
    const msg = (t, kind = "") => { $("#pl-msg").textContent = t; $("#pl-msg").className = "hint" + (kind ? " " + kind : ""); };
    async function fillPlaylists(selectId) {
      const lists = await listMyPlaylists().catch(() => []);
      sel.replaceChildren(...lists.map((p) => el("option", { value: p.id, textContent: p.name })),
        el("option", { value: "__new", textContent: "+ New playlist…" }));
      if (selectId) sel.value = selectId;
    }
    await fillPlaylists();
    $("#pl-add").onclick = async () => {
      msg("");
      try {
        let pid = sel.value;
        if (pid === "__new") {
          const name = prompt("Name your new playlist:");
          if (!name?.trim()) return;
          pid = (await createPlaylist({ name })).id;
          await fillPlaylists(pid);
        }
        await addToPlaylist(pid, song.id);
        const a = el("a", { href: playlistUrl(pid), textContent: "Open playlist" });
        msg("Added! ", "ok"); $("#pl-msg").append(a);
      } catch (e) { msg(friendlyError(e), "bad"); }
    };
    $("#credits").append(creditsList(credits));
    $("#main").hidden = false;
  }
</script>
</body>
</html>
