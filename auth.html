<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · MusicVibe</title>
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="./">
      <img class="logo" src="img/logo-192.png" alt="" width="34" height="34">
      MusicVibe
    </a>

    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to your feed and playlists.</p>

    <div class="alert warn show" id="config-warning" hidden>
      Supabase isn't connected yet. Paste your project URL and public key into <code>core/supabase-config.js</code>.
    </div>
    <div class="alert" id="alert" role="alert"></div>

    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-mode="signin" aria-selected="true">Sign in</button>
      <button type="button" role="tab" data-mode="signup" aria-selected="false">Sign up</button>
    </div>

    <!-- Google (shown on sign in + sign up) -->
    <div id="google-block">
      <button class="btn ghost" type="button" id="google-btn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span>Continue with Google</span>
      </button>
      <div class="divider">or with email</div>
    </div>

    <!-- SIGN IN -->
    <form id="form-signin" novalidate>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <span class="field">
          <input type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw">Show</button>
        </span>
      </label>
      <div class="row">
        <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in</label>
        <button type="button" class="link-btn" data-go="reset">Forgot password?</button>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>

    <!-- SIGN UP -->
    <form id="form-signup" novalidate hidden>
      <label>Display name
        <input type="text" name="displayName" autocomplete="name" maxlength="50" required placeholder="What should people call you?">
      </label>
      <label>Username
        <span class="field has-prefix">
          <span class="prefix">@</span>
          <input type="text" name="username" autocomplete="username" maxlength="20" required spellcheck="false" autocapitalize="off">
        </span>
        <span class="hint" data-hint="username">3–20 characters: letters, numbers, _ and .</span>
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <span class="field">
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="toggle-pw">Show</button>
        </span>
        <span class="pw-meter"><span></span></span>
        <span class="hint" data-hint="password">At least 8 characters.</span>
      </label>
      <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in</label>
      <button class="btn primary" type="submit">Create account</button>
    </form>

    <!-- RESET PASSWORD -->
    <form id="form-reset" novalidate hidden>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <button class="btn primary" type="submit">Send reset link</button>
      <button class="btn ghost" type="button" data-go="signin">Back to sign in</button>
    </form>

    <!-- SET NEW PASSWORD (after clicking the reset link in the email) -->
    <form id="form-newpassword" novalidate hidden>
      <label>New password
        <span class="field">
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="toggle-pw">Show</button>
        </span>
        <span class="hint">At least 8 characters.</span>
      </label>
      <button class="btn primary" type="submit">Save new password</button>
    </form>

    <!-- PICK USERNAME (first Google sign-in, or any account without a profile) -->
    <form id="form-username" novalidate hidden>
      <label>Display name
        <input type="text" name="displayName" autocomplete="name" maxlength="50" required>
      </label>
      <label>Username
        <span class="field has-prefix">
          <span class="prefix">@</span>
          <input type="text" name="username" autocomplete="username" maxlength="20" required spellcheck="false" autocapitalize="off">
        </span>
        <span class="hint" data-hint="username">3–20 characters: letters, numbers, _ and .</span>
      </label>
      <button class="btn primary" type="submit">Finish setup</button>
      <button class="btn ghost" type="button" id="cancel-setup">Use a different account</button>
    </form>

    <p class="foot" id="foot">Making music? Set up an artist profile on <a href="../ProArtists/">ProArtists</a>.</p>
  </div>
</main>
<script type="module" src="js/auth.js"></script>
</body>
</html>
