<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicVibe</title>
  <meta name="description" content="Make playlists, follow artists and build your music feed.">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="hero">
  <div>
    <img class="hero-logo" src="img/logo-512.png" alt="MusicVibe logo" width="120" height="120">
    <h1>Your music.<br><em>Your vibe.</em></h1>
    <p>Build a feed around the artists you love, make playlists, and find what's next.</p>
    <div class="cta">
      <a class="btn primary" href="auth.html?mode=signup">Get started</a>
      <a class="btn ghost" href="auth.html?mode=signin">Sign in</a>
    </div>
    <p style="margin-top:28px;font-size:14px">Are you an artist? <a href="../ProArtists/">Go to ProArtists →</a></p>
  </div>
</main>
<script type="module">
  import { isConfigured, currentUser } from "./core/mv.js";
  // Already signed in? Skip the landing page.
  if (isConfigured && await currentUser()) location.replace("app.html");
</script>
</body>
</html>
